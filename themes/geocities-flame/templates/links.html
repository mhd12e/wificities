<h2>&#x1f517; Cool Links</h2>

<div class="links-list">
  {{#each links}}
  <div class="link-item">
    <div class="link-bullet">&#x27a1;&#xfe0f;</div>
    <div class="link-content">
      <a href="{{url}}" class="link-title">{{title}}</a>
      <div class="link-desc">{{description}}</div>
    </div>
  </div>
  {{/each}}
</div>

<div class="content-section">
  {{{content}}}
</div>

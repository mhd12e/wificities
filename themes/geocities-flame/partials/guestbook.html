<div class="guestbook">
  <div id="gb-entries" class="gb-entries">
    <p class="gb-loading"><em>Loading guestbook...</em></p>
  </div>

  <form id="gb-form" class="gb-form">
    <div class="gb-field">
      <label for="gb-name">Your Name:</label>
      <input type="text" id="gb-name" name="name" maxlength="32"
             placeholder="CoolVisitor99" required class="gb-input">
    </div>
    <div class="gb-field">
      <label for="gb-message">Message:</label>
      <textarea id="gb-message" name="message" maxlength="256" rows="3"
                placeholder="Leave a message..." required class="gb-input"></textarea>
    </div>
    <button type="submit" class="gb-submit">Sign Guestbook!</button>
    <div id="gb-error" class="gb-error"></div>
  </form>
</div>

<script>
(function() {
  function loadGuestbook() {
    fetch('/api/guestbook')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var el = document.getElementById('gb-entries');
        if (!data.entries || data.entries.length === 0) {
          el.innerHTML = '<p class="gb-empty"><em>No entries yet. Be the first to sign!</em></p>';
          return;
        }
        var html = '';
        for (var i = data.entries.length - 1; i >= 0; i--) {
          var e = data.entries[i];
          html += '<div class="gb-entry">' +
            '<span class="gb-name">' + e.name + '</span>' +
            '<span class="gb-date">#' + e.id + '</span>' +
            '<div class="gb-msg">' + e.message + '</div>' +
            '</div>';
        }
        el.innerHTML = html;
      })
      .catch(function() {
        document.getElementById('gb-entries').innerHTML =
          '<p><em>Could not load guestbook.</em></p>';
      });
  }

  loadGuestbook();

  document.getElementById('gb-form').addEventListener('submit', function(ev) {
    ev.preventDefault();
    var name = document.getElementById('gb-name').value;
    var message = document.getElementById('gb-message').value;
    var errorEl = document.getElementById('gb-error');
    errorEl.textContent = '';

    fetch('/api/guestbook', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, message: message })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.ok) {
        document.getElementById('gb-name').value = '';
        document.getElementById('gb-message').value = '';
        loadGuestbook();
      } else if (data.error === 'rate_limited') {
        errorEl.textContent = 'Slow down! Wait ' + data.retry_after + 's before posting again.';
      } else {
        errorEl.textContent = data.message || 'Something went wrong.';
      }
    })
    .catch(function() {
      errorEl.textContent = 'Could not reach the server.';
    });
  });
})();
</script>

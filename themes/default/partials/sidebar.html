<div class="sidebar-box">
  <div class="sidebar-title">About</div>
  <div class="sidebar-content">
    <p><strong>{{owner_name}}</strong></p>
    <p>{{bio}}</p>
  </div>
</div>

<div class="sidebar-box">
  <div class="sidebar-title">Info</div>
  <div class="sidebar-content">
    <p>&#x1f4e1; Hosted on ESP32</p>
    <p>&#x1f4f6; No internet needed</p>
    <p>&#x1f30d; Powered by WifiCities</p>
  </div>
</div>

{{#if show_visitor_counter}}
<div class="sidebar-box">
  <div class="sidebar-title">Visitors</div>
  <div class="sidebar-content">
    <div id="visitor-counter" class="visitor-counter">...</div>
    <script>
      fetch('/api/visitors').then(function(r){return r.json()}).then(function(d){
        document.getElementById('visitor-counter').innerHTML=
          '<span class="counter-num">'+d.total+'</span> total'+
          '<br><span class="counter-current">'+d.current+' here now</span>';
      }).catch(function(){});
    </script>
  </div>
</div>
{{/if}}

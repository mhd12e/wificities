{{#if header_style_banner}}
<div class="header-banner">
  <h1 class="header-title">{{site_title}}</h1>
  <p class="header-subtitle">A WifiCity by {{owner_name}}</p>
</div>
{{/if}}

{{#if header_style_minimal}}
<div class="header-minimal">
  <span class="header-title">{{site_title}}</span>
  <span class="header-subtitle">by {{owner_name}}</span>
</div>
{{/if}}

{{#if header_style_centered}}
<div class="header-centered">
  <div class="header-decoration">- - - * - - -</div>
  <h1 class="header-title">{{site_title}}</h1>
  <p class="header-subtitle">A WifiCity by {{owner_name}}</p>
  <div class="header-decoration">- - - * - - -</div>
</div>
{{/if}}

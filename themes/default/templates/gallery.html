<h2 style="font-family:var(--font-heading); color:var(--accent-secondary);">Gallery</h2>

<div class="gallery-grid">
  {{#each images}}
  <div class="gallery-item">
    <a href="{{url}}"><img src="{{url}}" alt="{{title}}" class="gallery-thumb"></a>
    <div class="gallery-caption">{{title}}</div>
  </div>
  {{/each}}
</div>

<div class="content-section">
  {{{content}}}
</div>

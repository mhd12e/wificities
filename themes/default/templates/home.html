<div class="welcome-section">
  {{#if show_construction}}
  <div class="construction-banner">UNDER CONSTRUCTION</div>
  {{/if}}

  <h1 class="welcome-title">Welcome to {{site_title}}!</h1>

  {{#if show_marquee}}
  <div class="marquee-box">
    <marquee behavior="alternate" scrollamount="2">{{bio}}</marquee>
  </div>
  {{/if}}

  <div class="divider"></div>
</div>

<div class="content-section">
  {{{content}}}
</div>

{{#if show_guestbook}}
<div class="divider"></div>
<h2 style="font-family:var(--font-heading); color:var(--accent-secondary);">Guestbook</h2>
{{> guestbook}}
{{/if}}
